<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>LeanSkill – Perfil</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --Verde-claro: #03624c;
        --Verde-oscuro: #032221;
        --anti-flash-white: #fff6d6;
        --shadow-color: rgba(0, 0, 0, 0.25);
        --Verde-azulado: #062e2d;
      }

      body {
        background: linear-gradient(
          135deg,
          var(--Verde-oscuro),
          var(--Verde-claro)
        );
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      /* ==========================
         Sidebar (Menú lateral principal)
         ========================== */
      #navbarLateral {
        background-color: var(--Verde-azulado) !important;
        width: 198px;
      }

      #navbarLateral .navbar-brand {
        color: white;
        font-weight: 500;
      }

      #navbarLateral .nav-link {
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.75rem;
        transition: background-color 0.2s, color 0.2s;
      }

      #navbarLateral .nav-link:hover {
        background-color: var(--Verde-claro);
        color: white;
      }

      #navbarLateral .nav-link.active {
        background-color: var(--Verde-oscuro);
        color: white;
      }

      #navbarLateral .dropdown-menu {
        background-color: var(--Verde-azulado);
      }

      #navbarLateral .dropdown-item {
        color: white;
      }

      #navbarLateral .dropdown-item:hover {
        background-color: var(--Verde-claro);
        color: white;
      }

      /* Footer dentro del sidebar, pegado al fondo */
      #navbarLateral .navbar-footer {
        margin-top: auto;
        padding: 1rem 0;
      }

      /* ==========================
         Navbar secundaria (Perfil)
         ========================== */
      #navbarSecundario {
        background-color: var(--Verde-azulado);
        height: 70px;
      }

      #navbarSecundario .navbar-brand {
        color: white;
        font-weight: 500;
      }

      #navbarSecundario .nav-link {
        color: white;
        padding: 0.5rem 1rem;
        transition: background-color 0.2s, color 0.2s;
      }

      #navbarSecundario .nav-link:hover {
        background-color: var(--Verde-claro);
        color: white;
      }

      #navbarSecundario .nav-link.active {
        background-color: var(--Verde-claro);
        color: white;
      }

      /* ==========================
         Estilos adicionales para el main
         ========================== */
      main {
        padding: 1rem 2rem;
      }

      /* Aseguramos que el contenido principal use todo el espacio restante */
      .d-flex > main {
        flex-grow: 1;
      }

      /* Etiquetas (labels) en negro */
      .form-label {
        color: black !important;
      }

      /* Tarjeta con bordes redondeados y sombra */
      .config-card {
        background-color: var(--anti-flash-white);
        border-radius: 0.75rem;
        box-shadow: 0 4px 12px var(--shadow-color);
        padding: 1.5rem;
      }

      /* Centrar contenido */
      .center-container {
        display: flex;
        justify-content: center;
        align-items: start;
      }

      /* Ajustar ancho máximo para tarjetas */
      .card-wrapper {
        width: 100%;
        max-width: 600px;
      }

      /* Tabla dentro de tarjeta */
      .table-card {
        background-color: var(--anti-flash-white);
        border-radius: 0.75rem;
        box-shadow: 0 4px 12px var(--shadow-color);
        padding: 1rem;
      }

      .table-card h3 {
        color: #032221;
        margin-bottom: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="d-flex">
      <!-- ==========================
         Menú lateral principal (Sidebar)
         ========================== -->
      <nav id="navbarLateral" class="navbar d-flex flex-column min-vh-100">
        <div class="container-fluid d-flex flex-column h-100 p-0">
          <!-- Logo y título del sidebar -->
          <a class="navbar-brand d-flex align-items-center px-3 py-2" href="#">
            <img
              src="../img/LogoLeanSkill.jpeg"
              width="50"
              height="50"
              class="me-2"
              alt="Logo LeanSkill"
            />
            Estudiante
          </a>

          <!-- Ítems de navegación -->
          <ul class="navbar-nav flex-column px-3 flex-grow-1">
            <li class="nav-item">
              <a class="nav-link" href="../InicioStudent.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="PerfilStudent.html">Perfil</a>
            </li>

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="cursosDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Cursos
              </a>
              <ul class="dropdown-menu" aria-labelledby="cursosDropdown">
                <li>
                  <a class="dropdown-item" href="CursoIngles.html">Inglés</a>
                </li>
                <li>
                  <a class="dropdown-item" href="CursoEspanol.html">Español</a>
                </li>
              </ul>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="Notas.html">Notas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Profesores.html">Profesores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Docs.html">Entregas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Ayuda.html">Ayuda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Configuraciones.html"
                >Configuraciones</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../../../InicioSesion/Login.html"
                >Cerrar sesión</a
              >
            </li>
          </ul>

          <!-- Footer del sidebar (pegado al fondo) -->
          <div class="navbar-footer text-center text-white">
            <small>© 2023 LeanSkill. Todos los derechos reservados.</small>
          </div>
        </div>
      </nav>

      <!-- ==========================
         Contenido principal
         ========================== -->
      <main class="flex-fill">
        <!-- Barra secundaria de Perfil -->
        <nav
          id="navbarSecundario"
          class="navbar d-flex align-items-center px-3"
        >
          <a class="navbar-brand d-flex align-items-center" href="#">
            <img
              src="../img/LogoStudent.png"
              width="40"
              height="40"
              class="me-2"
              alt="Logo Perfil"
            />
            Perfil
          </a>

          <!-- Botón “Atrás” -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../InicioStudent.html">Atrás</a>
            </li>
          </ul>
        </nav>

        <!-- Contenido de la sección Perfil -->
        <section class="mt-4">
          <!-- Formulario centrado en tarjeta redondeada -->
          <div class="center-container" style="min-height: 80vh; padding-top: 2rem;">
            <div class="config-card card-wrapper">
              <div class="card-header text-white" style="background-color: #fff6d6">
                <h5 class="mb-0" style="color: black;">Información del Usuario</h5>
              </div>
              <div class="card-body">
                <form id="formPerfil">
                  <!-- Nombre -->
                  <div class="mb-3">
                    <label for="inputNombre" class="form-label">Nombre</label>
                    <input
                      type="text"
                      class="form-control"
                      id="inputNombre"
                      value="Sebastián"
                      disabled
                      required
                    />
                  </div>

                  <!-- Apellidos -->
                  <div class="mb-3">
                    <label for="inputApellidos" class="form-label"
                      >Apellidos</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="inputApellidos"
                      value="Rosales Martínez"
                      disabled
                      required
                    />
                  </div>

                  <!-- Correo Electrónico -->
                  <div class="mb-3">
                    <label for="inputEmail" class="form-label"
                      >Correo electrónico</label
                    >
                    <input
                      type="email"
                      class="form-control"
                      id="inputEmail"
                      value="sebastian.rosales@ejemplo.com"
                      disabled
                      required
                    />
                  </div>

                  <!-- Botones -->
                  <div class="d-flex justify-content-end">
                    <button
                      type="button"
                      class="btn btn-secondary me-2"
                      id="btnActualizar"
                    >
                      Actualizar Datos
                    </button>
                    <button
                      type="submit"
                      class="btn text-white"
                      id="btnGuardar"
                      style="background-color: #004d40; border: none"
                      disabled
                    >
                      Guardar Cambios
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Tabla de cursos centrada en tarjeta redondeada -->
          <div class="center-container mb-4">
            <div class="table-card" style="width: 100%; max-width: 800px;">
              <h3 class="text-center">Cursos que cursa este estudiante</h3>
              <div class="table-responsive">
                <table class="table table-striped table-dark mb-0">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Curso</th>
                      <th>Profesor</th>
                    </tr>
                  </thead>
                  <tbody id="tablaCursos">
                    <!-- Aquí se inyectarán las filas vía JavaScript -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ==========================
       JavaScript: Bootstrap + Script propio
       ========================== -->
    <!-- 1) Bootstrap Bundle JS (Popper incluido) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>

    <!-- 2) Script para togglear “active” en el sidebar -->
    <script>
      document.querySelectorAll("#navbarLateral .nav-link").forEach((link) => {
        link.addEventListener("click", () => {
          document
            .querySelectorAll("#navbarLateral .nav-link.active")
            .forEach((el) => el.classList.remove("active"));
          link.classList.add("active");
        });
      });
    </script>

    <!-- 3) Script para habilitar edición, validación y confirmaciones -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const btnActualizar = document.getElementById("btnActualizar");
        const btnGuardar = document.getElementById("btnGuardar");

        // Inputs del formulario (solo nombre, apellidos y correo)
        const inputs = [
          document.getElementById("inputNombre"),
          document.getElementById("inputApellidos"),
          document.getElementById("inputEmail"),
        ];

        btnActualizar.addEventListener("click", () => {
          const confirmar = confirm(
            "¿Estás seguro que quieres actualizar datos?"
          );
          if (!confirmar) return;

          // Habilitar campos
          inputs.forEach((el) => {
            el.disabled = false;
          });

          // Habilitar botón Guardar y deshabilitar Actualizar
          btnGuardar.disabled = false;
          btnActualizar.disabled = true;
        });

        btnGuardar.addEventListener("click", (event) => {
          event.preventDefault();

          // Validación: ningún campo puede quedar vacío
          const hayVacio = inputs.some((el) => el.value.trim() === "");
          if (hayVacio) {
            alert("Por favor completa todos los campos antes de guardar.");
            return;
          }

          const confirmar = confirm(
            "¿Estás seguro que quieres guardar los cambios?"
          );
          if (!confirmar) return;

          // Deshabilitar campos nuevamente
          inputs.forEach((el) => {
            el.disabled = true;
          });

          // Volver a habilitar Actualizar y deshabilitar Guardar
          btnActualizar.disabled = false;
          btnGuardar.disabled = true;

          alert("Cambios guardados correctamente.");
        });

        // Poblar la tabla de cursos
        const cursos = [
          { id: 1, nombre: "Inglés", profesor: "María Pérez" },
          { id: 2, nombre: "Español", profesor: "Juan Gómez" },
        ];
        const tbody = document.getElementById("tablaCursos");
        cursos.forEach((curso) => {
          const fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${curso.id}</td>
            <td>${curso.nombre}</td>
            <td>${curso.profesor}</td>
          `;
          tbody.appendChild(fila);
        });
      });
    </script>

    <!-- 4) Tu otro archivo JS si lo necesitas (por ejemplo, cargar profesores) -->
    <script src="../scripts/CargarProfesores.js" defer></script>
  </body>
</html>
